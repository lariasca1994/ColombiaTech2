<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sin conexión · Alquiler de vivienda</title>
    <meta name="theme-color" content="#047857">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('colombiatech-tema');
                if (t === 'oscuro' || t === 'claro') document.documentElement.setAttribute('data-tema', t);
            } catch (e) {}
        })();
    </script>
    <!-- Todo va dentro de este archivo: sin conexión no se puede pedir nada más.
         Los colores son los de Tailwind que usa el proyecto (esmeralda, grises, ámbar). -->
    <style>
        :root { --fondo: #ecfdf5; --superficie: #ffffff; --texto: #111827; --suave: #4b5563; --borde: #e5e7eb;
                --acento: #059669; --acento-texto: #047857; color-scheme: light; }
        [data-tema="oscuro"] { --fondo: #030712; --superficie: #111827; --texto: #f3f4f6; --suave: #9ca3af; --borde: #1f2937;
                --acento-texto: #34d399; color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: safe center;
               padding: 1.5rem max(1rem, env(safe-area-inset-right)) 1.5rem max(1rem, env(safe-area-inset-left));
               background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr); gap: 2.25rem; align-items: center; width: 100%; max-width: 44rem; }
        main > * { animation: entrar .5s cubic-bezier(.2, .8, .2, 1) both; }
        main > :nth-child(2) { animation-delay: 90ms; }
        @keyframes entrar { from { opacity: 0; transform: translate(22px, 8px); filter: blur(7px); } }
        .arte { position: relative; padding-bottom: 2.4rem; }
        .casa { border-radius: 14px; overflow: hidden; background: var(--superficie); border: 1px solid var(--borde); box-shadow: 0 22px 44px -26px #064e3b; }
        .foto { position: relative; display: grid; place-items: end center; height: 7.5rem; color: rgba(255, 255, 255, .9);
                background: linear-gradient(135deg, #34d399, #14b8a6); filter: grayscale(.6); }
        .foto svg { width: 4.5rem; }
        .barrido { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #fff; box-shadow: 0 0 10px #fff; animation: barrer 2.4s ease-in-out infinite alternate; }
        @keyframes barrer { to { top: 100%; } }
        .sello { position: absolute; top: .8rem; right: .8rem; padding: .15rem .55rem; border: 2px solid #e11d48; border-radius: 4px; background: var(--superficie);
                 color: #e11d48; font-size: .68rem; font-weight: 800; letter-spacing: .12em; transform: rotate(8deg); animation: sellar .32s .8s cubic-bezier(.3, 1.6, .5, 1) both; }
        [data-tema="oscuro"] .sello { border-color: #fb7185; color: #fb7185; }
        @keyframes sellar { from { opacity: 0; transform: rotate(8deg) scale(2); } }
        .datos { padding: .8rem 1rem 1rem; }
        .datos p { margin: 0; } .datos .c { font-weight: 700; } .datos .s { font-size: .8rem; color: var(--suave); margin-top: .15rem; }
        .mensaje { position: absolute; right: -.5rem; bottom: 0; max-width: 14rem; padding: .55rem .85rem; border-radius: 16px 16px 4px 16px;
                   background: #fcd34d; color: #022c22; font-size: .82rem; box-shadow: 0 12px 24px -12px rgba(0, 0, 0, .35); animation: llega .4s 1.1s ease-out both; }
        .mensaje p { margin: 0; font-weight: 600; } .mensaje span { font-size: .7rem; opacity: .75; }
        @keyframes llega { from { opacity: 0; transform: scale(.85); } }
        h1 { margin: 0 0 .6rem; font-size: 1.6rem; letter-spacing: -.02em; }
        p.t { margin: 0 0 1rem; color: var(--suave); line-height: 1.55; }
        .reintento { display: flex; align-items: center; gap: .55rem; font-size: .85rem; color: var(--suave); margin-bottom: 1rem; }
        .cuenta { width: 1.4rem; height: 1.4rem; transform: rotate(-90deg); }
        .cuenta circle { fill: none; stroke-width: 3; }
        .cuenta .f { stroke: var(--borde); }
        .cuenta .v { stroke: var(--acento); stroke-linecap: round; stroke-dasharray: 1; transition: stroke-dashoffset 1s linear; }
        button { min-height: 44px; padding: 0 1.3rem; border: 0; border-radius: 8px; background: var(--acento); color: #fff; font: inherit; font-weight: 700; cursor: pointer; transition: transform .18s, filter .2s; }
        button:hover { filter: brightness(1.06); transform: translateY(-1px); }
        button:active { transform: scale(.97); }
        button:focus-visible { outline: 2px solid var(--acento-texto); outline-offset: 2px; }
        @media (max-width: 640px) { main { grid-template-columns: 1fr; gap: 1.75rem; } .arte { max-width: 17rem; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <main>
        <div class="arte" aria-hidden="true">
            <div class="casa">
                <div class="foto">
                    <svg viewBox="0 0 40 30" fill="currentColor"><path d="M4 16 L20 4 L36 16 V30 H4 Z"/></svg>
                    <span class="barrido"></span>
                    <span class="sello">SIN CONEXIÓN</span>
                </div>
                <div class="datos"><p class="c">Tus casas</p><p class="s">guardadas en la nube · en espera</p></div>
            </div>
            <div class="mensaje"><p>Hola, ¿la casa sigue disponible?</p><span>sin conexión</span></div>
        </div>
        <div role="status" aria-live="polite">
            <h1>Sin conexión</h1>
            <p class="t">Alquiler de vivienda necesita internet para mostrar las casas y el chat en vivo. Cuando vuelva la red, esta pantalla se quita sola.</p>
            <div class="reintento">
                <svg class="cuenta" viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="12" cy="12" r="9"/><circle class="v" cx="12" cy="12" r="9" pathLength="1"/></svg>
                <span id="texto">Reintento automático en 8 s</span>
            </div>
            <button type="button" id="reintentar">Reintentar ahora</button>
        </div>
    </main>
    <script>
        // Reintento automático cada 8 s. HEAD no pasa por el service worker (solo
        // atiende GET), así que solo responde si de verdad hay red.
        (function () {
            var TOTAL = 8, resto = TOTAL, revisando = false;
            var texto = document.getElementById('texto'), arco = document.querySelector('.cuenta .v');
            function pintar(t) { texto.textContent = t; arco.style.strokeDashoffset = String(revisando ? 0 : 1 - resto / TOTAL); }
            function revisar() {
                if (revisando) return;
                revisando = true;
                pintar('Comprobando…');
                fetch('/', { method: 'HEAD', cache: 'no-store' })
                    .then(function () { location.reload(); })
                    .catch(function () { revisando = false; resto = TOTAL; pintar('Seguimos sin red. Reintento en ' + TOTAL + ' s'); });
            }
            document.getElementById('reintentar').addEventListener('click', revisar);
            window.addEventListener('online', revisar);
            setInterval(function () {
                if (revisando) return;
                resto -= 1;
                if (resto <= 0) { revisar(); return; }
                pintar('Reintento automático en ' + resto + ' s');
            }, 1000);
        })();
    </script>
</body>
</html>
