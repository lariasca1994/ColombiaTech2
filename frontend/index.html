<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#047857" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ColombiaTech · Casas y chat en vivo</title>
    <script>
      // Aplica el tema guardado ANTES de que React monte, para evitar
      // el parpadeo de tema claro -> oscuro en la primera carga.
      (function () {
        try {
          var guardado = localStorage.getItem('colombiatech-tema');
          if (guardado === 'oscuro' || guardado === 'claro') {
            document.documentElement.setAttribute('data-tema', guardado);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
